<h1>Productos</h1>

<button type="button" (click)="iniciarSesion()">
  Entrar con Google
</button>

<form
  #formularioProducto
  (submit)="guardarProducto($event, formularioProducto)">

  <label>
    Nombre
    <input
      name="nombre"
      type="text"
      pattern=".*\S.*"
      [value]="productoEnEdicion()?.nombre ?? ''"
      (invalid)="mensaje.set('Escribe un nombre de producto. No puede contener solo espacios.')"
      (input)="mensaje.set('')"
      required>
  </label>

  <label>
    Precio
    <input
      name="precio"
      type="number"
      min="0"
      step="any"
      [value]="productoEnEdicion()?.precio ?? ''"
      (invalid)="mensaje.set('El precio es obligatorio y debe ser un número mayor o igual a cero.')"
      (input)="mensaje.set('')"
      required>
  </label>

  <label>
    Stock
    <input
      name="stock"
      type="number"
      min="0"
      step="1"
      [value]="productoEnEdicion()?.stock ?? ''"
      (invalid)="mensaje.set('El stock es obligatorio y debe ser un entero mayor o igual a cero.')"
      (input)="mensaje.set('')"
      required>
  </label>

  <label>
    Categoría
    <input
      name="categoria"
      type="text"
      pattern=".*\S.*"
      [value]="productoEnEdicion()?.categoria ?? ''"
      (invalid)="mensaje.set('Escribe una categoría. No puede contener solo espacios.')"
      (input)="mensaje.set('')"
      required>
  </label>

  <button type="submit" [disabled]="guardando()">
    {{
      guardando()
        ? 'Guardando…'
        : productoEnEdicion()
          ? 'Guardar cambios'
          : 'Guardar producto'
    }}
  </button>
</form>

@if (mensaje()) {
  <p role="status">{{ mensaje() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Precio</th>
      <th>Stock</th>
      <th>Categoría</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    @for (producto of productos(); track producto.id) {
      <tr>
        <td>{{ producto.nombre }}</td>
        <td>${{ producto.precio }}</td>
        <td>{{ producto.stock }}</td>
        <td>{{ producto.categoria }}</td>

        <td>
          <button
            type="button"
            [disabled]="guardando()"
            (click)="productoEnEdicion.set(producto)">
            Editar
          </button>

          <button
            type="button"
            class="boton-eliminar"
            [disabled]="guardando()"
            (click)="eliminarProducto(producto, formularioProducto)">
            Eliminar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">No hay productos para mostrar.</td>
      </tr>
    }
  </tbody>
</table>

<router-outlet />
